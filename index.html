<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniSource</title>
<script>
  (() => {
    if (location.hash && location.hash.length > 1) {
      document.documentElement.dataset.redirecting = "true";
      location.replace("report.html" + location.hash);
      return;
    }
    const saved = localStorage.getItem("omnisource-theme");
    document.documentElement.dataset.theme = saved || "dark";
  })();
</script>
<style>
  :root {
    --bg:#070912; --panel:#111522; --fg:#f0f3ff; --muted:#9da6bf; --body:#cdd4e6;
    --accent:#74e0ff; --accent-2:#8b7cff; --border:#252b40; --soft-border:#333b56;
    --ink:#0d1018; --button:#f0f1f8; --button-fg:#11131c;
  }
  :root[data-theme="light"] {
    --bg:#f7f8fb; --panel:#ffffff; --fg:#171821; --muted:#687084; --body:#303545;
    --accent:#167fa5; --accent-2:#4257c9; --border:#dfe3ee; --soft-border:#d7dce8;
    --ink:#ffffff; --button:#171821; --button-fg:#ffffff;
  }
  * { box-sizing:border-box; }
  html[data-redirecting="true"] body { display:none; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; }
  .home-hero { position:relative; min-height:470px; overflow:hidden; background:#060817;
    border-bottom:1px solid var(--border); box-shadow:inset 0 -140px 110px var(--bg); }
  .home-hero::before { content:""; position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(rgba(124,131,255,.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(116,224,255,.08) 1px, transparent 1px);
    background-size:42px 42px; opacity:.38; mask-image:linear-gradient(to bottom, rgba(0,0,0,.86), transparent 86%); }
  .home-hero::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(110deg, rgba(6,8,23,.92) 0%, rgba(6,8,23,.58) 48%, rgba(6,8,23,.78) 100%); }
  .hero-network { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; }
  .home-hero-inner { position:relative; z-index:2; max-width:1180px; margin:0 auto; min-height:470px;
    padding:24px 20px 104px; display:flex; flex-direction:column; justify-content:space-between; }
  .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand-mark { display:inline-flex; align-items:center; gap:10px; color:#fff; font-weight:900; letter-spacing:0; }
  .brand-dot { width:12px; height:12px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 5px rgba(116,224,255,.16); }
  .top-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .lang-switch, .theme-switch { display:inline-flex; align-items:center; gap:2px; padding:3px;
    background:rgba(15,17,28,.78); border:1px solid rgba(255,255,255,.16); border-radius:999px;
    box-shadow:0 12px 34px rgba(0,0,0,.22); }
  .lang-option { display:grid; place-items:center; min-width:42px; height:32px; border-radius:999px;
    padding:0 .75rem; color:rgba(255,255,255,.72); font-size:.78rem; font-weight:800; line-height:1; }
  .lang-option.active { background:var(--accent-2); color:#fff; }
  .theme-option { appearance:none; display:grid; place-items:center; width:32px; height:32px; border:0;
    border-radius:999px; padding:0; background:transparent; color:rgba(255,255,255,.72);
    font-size:1rem; line-height:1; cursor:pointer; }
  .theme-option.active { background:var(--accent-2); color:#fff; }
  .hero-copy { max-width:820px; color:#fff; text-shadow:0 18px 64px rgba(0,0,0,.5); }
  .eyebrow { color:#bfeeff; font-size:.78rem; font-weight:900; letter-spacing:.08em; text-transform:uppercase; }
  h1 { margin:10px 0 0; font-size:clamp(3.3rem, 8vw, 7rem); line-height:.9; letter-spacing:0; }
  .hero-copy p { max-width:760px; margin:18px 0 0; color:rgba(255,255,255,.86);
    font-size:clamp(1.05rem, 2vw, 1.35rem); line-height:1.48; }
  .home-shell { max-width:1180px; margin:-54px auto 0; padding:0 20px 76px; }
  .entry-grid { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px; align-items:stretch; }
  .entry-card { min-height:260px; border:1px solid var(--border); border-radius:10px;
    background:color-mix(in srgb, var(--panel) 92%, transparent); padding:22px;
    box-shadow:0 18px 54px rgba(0,0,0,.18); display:flex; flex-direction:column; gap:16px; }
  .entry-card.primary { border-color:rgba(124,131,255,.58); }
  .entry-kicker { color:var(--accent); font-size:.76rem; font-weight:900; letter-spacing:.06em; text-transform:uppercase; }
  .entry-card h2 { margin:0; font-size:1.55rem; line-height:1.16; letter-spacing:0; }
  .entry-card p { margin:0; color:var(--body); font-size:1rem; }
  .entry-card footer { margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .entry-link { display:inline-flex; align-items:center; justify-content:center; min-height:40px; padding:0 15px;
    border-radius:999px; background:var(--button); color:var(--button-fg); font-weight:900; }
  .entry-link.secondary { background:transparent; color:var(--fg); border:1px solid var(--soft-border); }
  .metric-row { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px; margin-top:16px; }
  .metric { border:1px solid var(--border); border-radius:10px; background:var(--panel); padding:16px; }
  .metric strong { display:block; font-size:1.6rem; line-height:1; }
  .metric span { display:block; margin-top:7px; color:var(--muted); font-size:.84rem; }
  @media (max-width:800px) {
    .home-hero, .home-hero-inner { min-height:390px; }
    .topline { align-items:flex-start; flex-direction:column; }
    .entry-grid, .metric-row { grid-template-columns:1fr; }
  }
</style></head>
<body>
<header class="home-hero">
  <canvas class="hero-network" id="heroNetwork" aria-hidden="true"></canvas>
  <div class="home-hero-inner">
    <div class="topline">
      <div class="brand-mark"><span class="brand-dot" aria-hidden="true"></span><span>OmniSource</span></div>
      <div class="top-actions">
        <div class="lang-switch" aria-label="Language"><a class="lang-option active" href="./" hreflang="zh">中文</a><a class="lang-option" href="en/" hreflang="en">EN</a></div>
        <div class="theme-switch" role="group" aria-label="主题">
          <button class="theme-option" type="button" data-theme-choice="dark" aria-label="暗色主题" title="暗色主题"><span aria-hidden="true">☾</span></button>
          <button class="theme-option" type="button" data-theme-choice="light" aria-label="亮色主题" title="亮色主题"><span aria-hidden="true">☀</span></button>
        </div>
      </div>
    </div>
    <div class="hero-copy">
      <div class="eyebrow">AI research signal desk</div>
      <h1>OmniSource</h1>
      <p>把每日科研情报和每周 AI 工具推荐放在同一个工作台。</p>
    </div>
  </div>
</header>
<main class="home-shell">
  <section class="entry-grid" aria-label="OmniSource entry points">
    <article class="entry-card primary">
      <div class="entry-kicker">Report</div>
      <h2>科研情报日报</h2>
      <p>进入你配置好的 track，查看论文、社区动态、实验室博客、开源项目和作者关系图。</p>
      <footer><a class="entry-link" href="report.html">进入 Report</a></footer>
    </article>
    <article class="entry-card">
      <div class="entry-kicker">Tool Radar</div>
      <h2>每周工具雷达</h2>
      <p>每周挑选有趣/有用的 AI 工具，保留推荐理由、收藏入口和订阅意向。</p>
      <footer><a class="entry-link secondary" href="tools.html">查看工具</a></footer>
    </article>
  </section>
  <section class="metric-row" aria-label="OmniSource summary">
    <div class="metric"><strong>2</strong><span>个研究 track</span></div>
    <div class="metric"><strong>6</strong><span>个工具推荐</span></div>
    <div class="metric"><strong>2</strong><span>中英双语</span></div>
  </section>
</main>
<script>
  const applyTheme = choice => {
    document.documentElement.dataset.theme = choice;
    localStorage.setItem("omnisource-theme", choice);
    document.querySelectorAll("[data-theme-choice]").forEach(button => {
      button.classList.toggle("active", button.dataset.themeChoice === choice);
    });
  };
  applyTheme(localStorage.getItem("omnisource-theme") || "dark");
  document.querySelectorAll("[data-theme-choice]").forEach(button => {
    button.addEventListener("click", () => applyTheme(button.dataset.themeChoice));
  });
  const canvas = document.getElementById("heroNetwork");
  const hero = document.querySelector(".home-hero");
  const ctx = canvas.getContext("2d");
  const pointer = { x: 0, y: 0, active: false };
  let width = 0;
  let height = 0;
  let nodes = [];
  const colors = {
    node: "rgba(132, 226, 255, 0.88)",
    nodeAlt: "rgba(151, 129, 255, 0.76)",
    line: "rgba(126, 139, 255, 0.28)",
    lineHot: "rgba(116, 224, 255, 0.46)",
    scan: "rgba(116, 224, 255, 0.10)"
  };
  const resizeNetwork = () => {
    const rect = hero.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = Math.max(1, Math.floor(rect.width));
    height = Math.max(1, Math.floor(rect.height));
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.max(46, Math.min(86, Math.floor(width / 18)));
    nodes = Array.from({ length: count }, (_, index) => ({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - .5) * .18,
      vy: (Math.random() - .5) * .18,
      r: index % 7 === 0 ? 2.2 : 1.35 + Math.random() * 1.2,
      phase: Math.random() * Math.PI * 2
    }));
  };
  hero.addEventListener("pointermove", event => {
    const rect = hero.getBoundingClientRect();
    pointer.x = event.clientX - rect.left;
    pointer.y = event.clientY - rect.top;
    pointer.active = true;
  });
  hero.addEventListener("pointerleave", () => { pointer.active = false; });
  window.addEventListener("resize", resizeNetwork);
  const drawNetwork = time => {
    ctx.clearRect(0, 0, width, height);
    const t = time * 0.001;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < nodes.length; i += 1) {
      const a = nodes[i];
      a.x += a.vx + Math.sin(t + a.phase) * 0.045;
      a.y += a.vy + Math.cos(t * .8 + a.phase) * 0.035;
      if (a.x < -20) a.x = width + 20;
      if (a.x > width + 20) a.x = -20;
      if (a.y < -20) a.y = height + 20;
      if (a.y > height + 20) a.y = -20;
      if (pointer.active) {
        const dx = pointer.x - a.x;
        const dy = pointer.y - a.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 180 && distance > 0.1) {
          const pull = (1 - distance / 180) * 0.22;
          a.x += (dx / distance) * pull;
          a.y += (dy / distance) * pull;
        }
      }
      for (let j = i + 1; j < nodes.length; j += 1) {
        const b = nodes[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const distance = Math.hypot(dx, dy);
        if (distance < 124) {
          const alpha = 1 - distance / 124;
          ctx.strokeStyle = alpha > .62 ? colors.lineHot : colors.line;
          ctx.globalAlpha = alpha * .72;
          ctx.lineWidth = alpha > .62 ? 1.25 : .8;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    nodes.forEach((node, index) => {
      ctx.globalAlpha = .72 + Math.sin(t * 2 + node.phase) * .18;
      ctx.fillStyle = index % 5 === 0 ? colors.nodeAlt : colors.node;
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.strokeStyle = colors.scan;
    ctx.lineWidth = 1;
    for (let offset = -height; offset < width; offset += 170) {
      const x = (offset + (t * 42) % 170);
      ctx.beginPath();
      ctx.moveTo(x, height);
      ctx.lineTo(x + height * .9, 0);
      ctx.stroke();
    }
    ctx.restore();
    requestAnimationFrame(drawNetwork);
  };
  resizeNetwork();
  requestAnimationFrame(drawNetwork);
</script>
</body></html>
